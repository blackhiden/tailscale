name: Release Packages

# Builds and publishes Tailscale release packages for every supported
# distribution and architecture, and pushes the container image to GHCR.
#
# Triggered whenever a GitHub Release is published. The built artifacts
# (tgz, deb, rpm) are attached to the release, and the multi-platform
# container image is pushed to ghcr.io.

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # Converts the repository name to lowercase to prevent GHCR formatting errors
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Build all release packages (tgz, deb, rpm) for every supported
  # OS/architecture combination. Uses the canonical `cmd/dist` builder, which
  # knows the exact set of valid targets (see release/dist/unixpkgs/targets.go).
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go toolchain
        run: ./tool/go version

      - name: Build all release packages
        run: |
          # `dist build all` builds every valid target (tgz, deb, rpm) for all
          # supported OS/arch combinations. Artifacts are written to ./dist.
          ./tool/go run ./cmd/dist build --verbose all

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build and push the multi-platform container image to GHCR.
  # Adopted from .github/workflows/deploy.yaml.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Git Metadata
        id: git_meta
        run: |
          # Fallback to 'unknown' if no tags exist yet
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_COMMIT=$(git rev-parse --short HEAD)
          APP_COMMIT_LONG=$(git rev-parse HEAD)
          APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          APP_VERSION_LONG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")-${APP_COMMIT}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION_LONG=$APP_VERSION_LONG" >> $GITHUB_OUTPUT
          echo "APP_COMMIT=$APP_COMMIT" >> $GITHUB_OUTPUT
          echo "APP_COMMIT_LONG=$APP_COMMIT_LONG" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT

      # QEMU is required to emulate the arm64 architecture on the x86 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          build-args: |
            VERSION_SHORT=${{ steps.git_meta.outputs.APP_VERSION }}
            VERSION_LONG=${{ steps.git_meta.outputs.APP_VERSION_LONG }}
            VERSION_GIT_HASH=${{ steps.git_meta.outputs.APP_COMMIT }}
            APP_COMMIT_LONG=${{ steps.git_meta.outputs.APP_COMMIT_LONG }}
            BUILD_DATE=${{ steps.git_meta.outputs.BUILD_DATE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Attach all built packages to the GitHub Release.
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist

      - name: Upload packages to GitHub Release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });

            const files = fs.readdirSync('dist');
            for (const file of files) {
              const filePath = path.join('dist', file);
              const stat = fs.statSync(filePath);
              if (!stat.isFile()) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(filePath)
              });
              console.log(`Uploaded ${file}`);
            }